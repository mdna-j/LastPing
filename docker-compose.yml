services:
  api:
    build: .
    container_name: lastping_api
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  worker:
    build: .
    container_name: lastping_worker
    # Placeholder worker; replace with your worker module/command
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "-u", "-m", "src.worker"]
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; f='/tmp/lastping_worker.health';\
        import sys; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 120 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker_us:
    build: .
    container_name: lastping_worker_us
    profiles: ["multi-region"]
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "-u", "-m", "src.worker"]
    environment:
      RUN_MIGRATIONS: "0"
      WORKER_REGION: "us-east"
      WORKER_ID: "us-east-1"
      WORKER_REGION_FAILOVER: "1"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; f='/tmp/lastping_worker.health';\
        import sys; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 120 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker_eu:
    build: .
    container_name: lastping_worker_eu
    profiles: ["multi-region"]
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "-u", "-m", "src.worker"]
    environment:
      RUN_MIGRATIONS: "0"
      WORKER_REGION: "eu-west"
      WORKER_ID: "eu-west-1"
      WORKER_REGION_FAILOVER: "1"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; f='/tmp/lastping_worker.health';\
        import sys; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 120 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker_ap:
    build: .
    container_name: lastping_worker_ap
    profiles: ["multi-region"]
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "-u", "-m", "src.worker"]
    environment:
      RUN_MIGRATIONS: "0"
      WORKER_REGION: "ap-south"
      WORKER_ID: "ap-south-1"
      WORKER_REGION_FAILOVER: "1"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; f='/tmp/lastping_worker.health';\
        import sys; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 120 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:15
    container_name: lastping_db
    environment:
      POSTGRES_USER: lastping
      POSTGRES_PASSWORD: lastping
      POSTGRES_DB: lastping
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: lastping_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  db-data:
