name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Container image tag to deploy"
        required: true
        default: latest

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
      DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
      DEPLOY_ADMIN_TOKEN: ${{ secrets.DEPLOY_ADMIN_TOKEN }}
      DEPLOY_REDIS_URL: ${{ secrets.DEPLOY_REDIS_URL }}
      DEPLOY_SLACK_WEBHOOK_URL: ${{ secrets.DEPLOY_SLACK_WEBHOOK_URL }}
      DEPLOY_DISCORD_WEBHOOK_URL: ${{ secrets.DEPLOY_DISCORD_WEBHOOK_URL }}
      DEPLOY_TWILIO_ACCOUNT_SID: ${{ secrets.DEPLOY_TWILIO_ACCOUNT_SID }}
      DEPLOY_TWILIO_AUTH_TOKEN: ${{ secrets.DEPLOY_TWILIO_AUTH_TOKEN }}
      DEPLOY_TWILIO_FROM: ${{ secrets.DEPLOY_TWILIO_FROM }}
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
      LASTPING_IMAGE_REPOSITORY: ${{ vars.LASTPING_IMAGE_REPOSITORY }}
      LASTPING_INGRESS_HOST: ${{ vars.LASTPING_INGRESS_HOST }}
      LASTPING_NAMESPACE: ${{ vars.LASTPING_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate deploy-specific secrets and vars
        run: |
          missing=()
          [ -z "$DEPLOY_DATABASE_URL" ] && missing+=("DEPLOY_DATABASE_URL")
          [ -z "$DEPLOY_BASE_URL" ] && missing+=("DEPLOY_BASE_URL")
          [ -z "$DEPLOY_ADMIN_TOKEN" ] && missing+=("DEPLOY_ADMIN_TOKEN")
          [ -z "$KUBE_CONFIG_B64" ] && missing+=("KUBE_CONFIG_B64")
          [ -z "$LASTPING_IMAGE_REPOSITORY" ] && missing+=("LASTPING_IMAGE_REPOSITORY")
          [ -z "$LASTPING_INGRESS_HOST" ] && missing+=("LASTPING_INGRESS_HOST")
          if [ "${{ github.event.inputs.environment }}" = "production" ] && [ -z "$DEPLOY_REDIS_URL" ]; then
            missing+=("DEPLOY_REDIS_URL")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required deploy config:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - name: Render runtime env file
        run: |
          cat > deploy.runtime.env <<EOF
          DATABASE_URL=${DEPLOY_DATABASE_URL}
          BASE_URL=${DEPLOY_BASE_URL}
          ADMIN_TOKEN=${DEPLOY_ADMIN_TOKEN}
          REDIS_URL=${DEPLOY_REDIS_URL}
          SLACK_WEBHOOK_URL=${DEPLOY_SLACK_WEBHOOK_URL}
          DISCORD_WEBHOOK_URL=${DEPLOY_DISCORD_WEBHOOK_URL}
          TWILIO_ACCOUNT_SID=${DEPLOY_TWILIO_ACCOUNT_SID}
          TWILIO_AUTH_TOKEN=${DEPLOY_TWILIO_AUTH_TOKEN}
          TWILIO_FROM=${DEPLOY_TWILIO_FROM}
          EOF
      - name: Validate runtime env
        run: |
          python scripts/validate_env.py \
            --profile "${{ github.event.inputs.environment }}" \
            --env-file deploy.runtime.env \
            --format github
      - name: Publish summary
        run: |
          namespace="${LASTPING_NAMESPACE:-lastping-${{ github.event.inputs.environment }}}"
          {
            echo "## Deploy Validation"
            echo ""
            echo "- Environment: \`${{ github.event.inputs.environment }}\`"
            echo "- Namespace: \`${namespace}\`"
            echo "- Image repository: \`${LASTPING_IMAGE_REPOSITORY}\`"
            echo "- Image tag: \`${{ github.event.inputs.image_tag }}\`"
            echo "- Host: \`${LASTPING_INGRESS_HOST}\`"
            echo "- Runtime env: validated with \`scripts/validate_env.py\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment }}
    env:
      DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
      DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
      DEPLOY_ADMIN_TOKEN: ${{ secrets.DEPLOY_ADMIN_TOKEN }}
      DEPLOY_REDIS_URL: ${{ secrets.DEPLOY_REDIS_URL }}
      DEPLOY_SLACK_WEBHOOK_URL: ${{ secrets.DEPLOY_SLACK_WEBHOOK_URL }}
      DEPLOY_DISCORD_WEBHOOK_URL: ${{ secrets.DEPLOY_DISCORD_WEBHOOK_URL }}
      DEPLOY_TWILIO_ACCOUNT_SID: ${{ secrets.DEPLOY_TWILIO_ACCOUNT_SID }}
      DEPLOY_TWILIO_AUTH_TOKEN: ${{ secrets.DEPLOY_TWILIO_AUTH_TOKEN }}
      DEPLOY_TWILIO_FROM: ${{ secrets.DEPLOY_TWILIO_FROM }}
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
      LASTPING_IMAGE_REPOSITORY: ${{ vars.LASTPING_IMAGE_REPOSITORY }}
      LASTPING_INGRESS_HOST: ${{ vars.LASTPING_INGRESS_HOST }}
      LASTPING_NAMESPACE: ${{ vars.LASTPING_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Render runtime env file
        run: |
          cat > deploy.runtime.env <<EOF
          DATABASE_URL=${DEPLOY_DATABASE_URL}
          BASE_URL=${DEPLOY_BASE_URL}
          ADMIN_TOKEN=${DEPLOY_ADMIN_TOKEN}
          REDIS_URL=${DEPLOY_REDIS_URL}
          SLACK_WEBHOOK_URL=${DEPLOY_SLACK_WEBHOOK_URL}
          DISCORD_WEBHOOK_URL=${DEPLOY_DISCORD_WEBHOOK_URL}
          TWILIO_ACCOUNT_SID=${DEPLOY_TWILIO_ACCOUNT_SID}
          TWILIO_AUTH_TOKEN=${DEPLOY_TWILIO_AUTH_TOKEN}
          TWILIO_FROM=${DEPLOY_TWILIO_FROM}
          EOF
      - name: Validate runtime env
        run: |
          python scripts/validate_env.py \
            --profile "${{ github.event.inputs.environment }}" \
            --env-file deploy.runtime.env
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/lastping \
            -f deploy/helm/lastping/values.yaml \
            -f deploy/helm/lastping/values-${{ github.event.inputs.environment }}.yaml
      - name: Apply env secret
        run: |
          namespace="${LASTPING_NAMESPACE:-lastping-${{ github.event.inputs.environment }}}"
          kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic lastping-env \
            --namespace "$namespace" \
            --from-env-file=deploy.runtime.env \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy LastPing
        run: |
          namespace="${LASTPING_NAMESPACE:-lastping-${{ github.event.inputs.environment }}}"
          helm upgrade --install lastping deploy/helm/lastping \
            --namespace "$namespace" \
            --create-namespace \
            -f deploy/helm/lastping/values.yaml \
            -f deploy/helm/lastping/values-${{ github.event.inputs.environment }}.yaml \
            --set-string image.repository="$LASTPING_IMAGE_REPOSITORY" \
            --set-string image.tag="${{ github.event.inputs.image_tag }}" \
            --set-string ingress.hosts[0].host="$LASTPING_INGRESS_HOST"
      - name: Wait for rollouts
        run: |
          namespace="${LASTPING_NAMESPACE:-lastping-${{ github.event.inputs.environment }}}"
          for deploy in $(kubectl get deployment -n "$namespace" -l app.kubernetes.io/instance=lastping -o name); do
            kubectl rollout status -n "$namespace" "$deploy" --timeout=240s
          done
      - name: Smoke check health endpoint
        run: curl -fsS "${DEPLOY_BASE_URL}/health"
      - name: Publish summary
        run: |
          namespace="${LASTPING_NAMESPACE:-lastping-${{ github.event.inputs.environment }}}"
          {
            echo "## Deploy Complete"
            echo ""
            echo "- Environment: \`${{ github.event.inputs.environment }}\`"
            echo "- Namespace: \`${namespace}\`"
            echo "- Image: \`${LASTPING_IMAGE_REPOSITORY}:${{ github.event.inputs.image_tag }}\`"
            echo "- Health check: \`${DEPLOY_BASE_URL}/health\`"
          } >> "$GITHUB_STEP_SUMMARY"
