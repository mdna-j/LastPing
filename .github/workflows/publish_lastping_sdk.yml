name: Publish lastping-sdk

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest pytest-cov

      - name: Run test suite
        run: |
          echo "Running tests before packaging"
          python -m pytest --maxfail=1 -q

      - name: Validate candidate pyproject files
        run: |
          echo "Validating candidate pyproject.toml files"
          CANDIDATES=("./lastping_sdk/pyproject.toml" "./src/lastping_sdk/pyproject.toml" "./pyproject.toml")
          FOUND=0
          for f in "${CANDIDATES[@]}"; do
            if [ -f "$f" ]; then
              echo "Validating $f"
              python -c "import tomllib; tomllib.load(open('$f','rb'))" || { echo "TOML parse failed: $f"; exit 1; }
              echo "$f OK"
              FOUND=1
            else
              echo "Not present: $f"
            fi
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "Warning: no pyproject.toml found in candidate locations; build step will try locations." 
          fi

      - name: Build lastping-sdk
        working-directory: ./lastping_sdk
        run: |
          python -m build --sdist --wheel
          ls -la dist

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: ./lastping_sdk
        run: |
          python -m twine upload --non-interactive --skip-existing dist/*