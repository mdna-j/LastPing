name: Publish lastping-sdk

on:
  push:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build twine

      - name: Debug repo contents
        run: |
          echo "PWD: $(pwd)"
          echo "Listing repo root:"; ls -la

      - name: Build package
        run: |
          if [ -d "./lastping_sdk" ]; then
            echo "Found lastping_sdk; building package..."
            python -m build --sdist --wheel --outdir ./lastping_sdk/dist ./lastping_sdk
          else
            echo "Error: lastping_sdk directory not found at repo root." >&2
            echo "Listing current directory:"; ls -la
            exit 1
          fi

      - name: Publish to PyPI
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        working-directory: ./lastping_sdk/dist
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive --skip-existing *
