name: Publish lastping-sdk

on:
  push:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate `lastping_sdk/pyproject.toml`
        run: |
          echo "Validating lastping_sdk/pyproject.toml"
          python -c "import tomllib,sys; tomllib.loads(open('lastping_sdk/pyproject.toml','rb').read())"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build twine

      - name: Debug repo contents
        run: |
          echo "PWD: $(pwd)"
          echo "Listing repo root:"; ls -la

      - name: Build package (try multiple locations)
        run: |
          set -e
          CANDIDATES=("./lastping_sdk" "./src/lastping_sdk" ".")
          BUILT=0
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              if [ -f "$d/pyproject.toml" ] || [ -f "./pyproject.toml" ]; then
                echo "Attempting build from: $d"
                python -m build --sdist --wheel --outdir "$d/dist" "$d" || true
                if [ -d "$d/dist" ] && [ "$(ls -A $d/dist)" ]; then
                  echo "Build succeeded into $d/dist"
                  BUILT=1
                  break
                fi
              fi
            fi
          done
          if [ "$BUILT" -ne 1 ]; then
            echo "Error: could not locate a buildable package directory among: ${CANDIDATES[*]}" >&2
            echo "Repo root listing:"; ls -la
            exit 1
          fi

      - name: Publish to PyPI
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        working-directory: ./lastping_sdk/dist
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive --skip-existing *
