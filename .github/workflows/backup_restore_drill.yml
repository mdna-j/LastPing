name: Backup Restore Drill

on:
  schedule:
    - cron: "20 7 * * 1"
  workflow_dispatch:

jobs:
  restore_drill:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATABASE_URL: ${{ secrets.BACKUP_DRILL_SOURCE_DATABASE_URL }}
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lastping_restore
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lastping_restore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lastping_restore"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate restore-drill configuration
        run: |
          mkdir -p artifacts/backup_restore_drill
          if [ -z "$SOURCE_DATABASE_URL" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::error::Missing required scheduled configuration: BACKUP_DRILL_SOURCE_DATABASE_URL"
            printf '%s\n' '{"status":"failed_config","reason":"Missing BACKUP_DRILL_SOURCE_DATABASE_URL"}' > artifacts/backup_restore_drill/summary.json
            printf '%s\n' '## Backup Restore Drill\n\n- Status: `failed_config`\n- Reason: `Missing BACKUP_DRILL_SOURCE_DATABASE_URL`\n' > artifacts/backup_restore_drill/summary.md
            exit 1
          fi
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "::warning::BACKUP_DRILL_SOURCE_DATABASE_URL is not configured; manual run will skip."
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install -e .

      - name: Run backup restore drill
        run: |
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            printf '%s\n' '{"status":"skipped","reason":"BACKUP_DRILL_SOURCE_DATABASE_URL not configured"}' > artifacts/backup_restore_drill/summary.json
            printf '%s\n' '## Backup Restore Drill\n\n- Status: `skipped`\n- Reason: `BACKUP_DRILL_SOURCE_DATABASE_URL not configured`\n' > artifacts/backup_restore_drill/summary.md
            exit 0
          fi
          python scripts/backup_restore_drill.py \
            --source-url "$SOURCE_DATABASE_URL" \
            --restore-url "$RESTORE_DATABASE_URL" \
            --output-dir artifacts/backup_restore_drill \
            --format github

      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/backup_restore_drill/summary.md ]; then
            cat artifacts/backup_restore_drill/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-drill-${{ github.run_id }}
          path: artifacts/backup_restore_drill/
