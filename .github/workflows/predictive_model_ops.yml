name: Predictive Model Ops

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Training window in days"
        required: false
        default: "30"
      min_events:
        description: "Minimum weighted events required to train a model"
        required: false
        default: "10"
      eval_hours:
        description: "Quality evaluation window in hours"
        required: false
        default: "48"
      min_samples:
        description: "Minimum samples needed for quality status != insufficient_data"
        required: false
        default: "24"
      drift_ratio_threshold:
        description: "Drift ratio threshold (actual/expected)"
        required: false
        default: "2.0"
      mae_threshold:
        description: "MAE threshold for drift flagging"
        required: false
        default: "1.0"
      strict:
        description: "Fail workflow when drift is detected"
        required: false
        default: "false"
      disable_drifted:
        description: "Deactivate drifted models automatically"
        required: false
        default: "false"

jobs:
  predictive_model_ops:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.ANALYTICS_DATABASE_URL }}
      MODEL_OPS_OWNER: ${{ vars.MODEL_OPS_OWNER }}
      MODEL_OPS_ALERT_WEBHOOK_URL: ${{ secrets.MODEL_OPS_ALERT_WEBHOOK_URL }}
      DAYS: ${{ inputs.days }}
      MIN_EVENTS: ${{ inputs.min_events }}
      EVAL_HOURS: ${{ inputs.eval_hours }}
      MIN_SAMPLES: ${{ inputs.min_samples }}
      DRIFT_RATIO_THRESHOLD: ${{ inputs.drift_ratio_threshold }}
      MAE_THRESHOLD: ${{ inputs.mae_threshold }}
      STRICT_MODE: ${{ github.event_name == 'schedule' && 'true' || inputs.strict }}
      DISABLE_DRIFTED: ${{ github.event_name == 'schedule' && 'true' || inputs.disable_drifted }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate scheduled configuration
        run: |
          mkdir -p artifacts
          missing=()
          if [ -z "$DATABASE_URL" ]; then
            missing+=("ANALYTICS_DATABASE_URL")
          fi
          if [ -z "$MODEL_OPS_OWNER" ]; then
            missing+=("MODEL_OPS_OWNER")
          fi
          if [ -z "$MODEL_OPS_ALERT_WEBHOOK_URL" ]; then
            missing+=("MODEL_OPS_ALERT_WEBHOOK_URL")
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event_name = os.getenv("GITHUB_EVENT_NAME", "unknown")
          missing = []
          if not os.getenv("DATABASE_URL"):
              missing.append("ANALYTICS_DATABASE_URL")
          if not os.getenv("MODEL_OPS_OWNER"):
              missing.append("MODEL_OPS_OWNER")
          if not os.getenv("MODEL_OPS_ALERT_WEBHOOK_URL"):
              missing.append("MODEL_OPS_ALERT_WEBHOOK_URL")

          record = {
              "status": "ready" if not missing else "missing_config",
              "event": event_name,
              "required_for_schedule": [
                  "ANALYTICS_DATABASE_URL",
                  "MODEL_OPS_OWNER",
                  "MODEL_OPS_ALERT_WEBHOOK_URL",
              ],
              "missing": missing,
              "configured": {
                  "analytics_database_url": bool(os.getenv("DATABASE_URL")),
                  "model_ops_owner": bool(os.getenv("MODEL_OPS_OWNER")),
                  "model_ops_alert_webhook_url": bool(os.getenv("MODEL_OPS_ALERT_WEBHOOK_URL")),
              },
          }
          Path("artifacts/predictive_model_ops_readiness.json").write_text(
              json.dumps(record, indent=2),
              encoding="utf-8",
          )
          PY

          if [ "${#missing[@]}" -gt 0 ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::error::Missing required scheduled configuration: ${missing[*]}"
            printf '%s\n' '{"status":"failed_config","reason":"Missing required scheduled configuration"}' > artifacts/predictive_model_ops.json
            exit 1
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Missing configuration for manual run: ${missing[*]}"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install -e .

      - name: Run predictive model ops
        run: |
          mkdir -p artifacts
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::ANALYTICS_DATABASE_URL not set; skipping predictive model ops for manual run."
            printf '%s\n' '{"status":"skipped","reason":"ANALYTICS_DATABASE_URL not configured"}' > artifacts/predictive_model_ops.json
            exit 0
          fi

          cmd=(python scripts/predictive_model_ops.py
            --days "${DAYS:-30}"
            --min-events "${MIN_EVENTS:-10}"
            --eval-hours "${EVAL_HOURS:-48}"
            --min-samples "${MIN_SAMPLES:-24}"
            --drift-ratio-threshold "${DRIFT_RATIO_THRESHOLD:-2.0}"
            --mae-threshold "${MAE_THRESHOLD:-1.0}"
            --json-out artifacts/predictive_model_ops.json
          )
          if [ "${DISABLE_DRIFTED}" = "true" ]; then
            cmd+=(--disable-drifted)
          fi
          if [ "${STRICT_MODE}" = "true" ]; then
            cmd+=(--strict)
          fi
          "${cmd[@]}"

      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/predictive_model_ops.json ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("artifacts/predictive_model_ops.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          readiness_path = Path("artifacts/predictive_model_ops_readiness.json")
          readiness = {}
          if readiness_path.exists():
              readiness = json.loads(readiness_path.read_text(encoding="utf-8"))
          totals = data.get("totals", {})
          owner = os.getenv("MODEL_OPS_OWNER") or "unassigned"
          strict_mode = os.getenv("STRICT_MODE") or "false"
          event_name = os.getenv("GITHUB_EVENT_NAME") or "unknown"
          run_url = "{}/{}/actions/runs/{}".format(
              os.getenv("GITHUB_SERVER_URL"),
              os.getenv("GITHUB_REPOSITORY"),
              os.getenv("GITHUB_RUN_ID"),
          )

          lines = ["## Predictive Model Ops", ""]
          lines.append(f"- Event: `{event_name}`")
          lines.append(f"- Run URL: {run_url}")
          lines.append(f"- Owner: `{owner}`")
          lines.append(f"- Strict mode: `{strict_mode}`")
          if readiness:
              lines.append(f"- Config readiness: `{readiness.get('status', 'unknown')}`")
              missing = readiness.get("missing", [])
              if missing:
                  lines.append(f"- Missing config: `{', '.join(missing)}`")

          status = data.get("status")
          if status in {"skipped", "failed_config"}:
              lines.append(f"- Status: `{str(status).upper()}`")
              lines.append(f"- Reason: `{data.get('reason', 'unknown')}`")
          else:
              lines.append(f"- Projects: `{totals.get('projects', 0)}`")
              lines.append(f"- Trained models: `{totals.get('trained', 0)}`")
              lines.append(f"- Evaluated models: `{totals.get('evaluated', 0)}`")
              lines.append(f"- Drifted: `{totals.get('drifted', 0)}`")
              lines.append(f"- OK: `{totals.get('ok', 0)}`")
              lines.append(f"- Insufficient data: `{totals.get('insufficient_data', 0)}`")
              lines.append(f"- Retired superseded: `{totals.get('retired_superseded', 0)}`")
              lines.append(f"- Disabled drifted: `{totals.get('disabled_drifted', 0)}`")

          Path("artifacts/predictive_model_ops_summary.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
            cat artifacts/predictive_model_ops_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify drift owner
        if: always()
        run: |
          if [ ! -f artifacts/predictive_model_ops.json ]; then
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("artifacts/predictive_model_ops.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          status = data.get("status")
          totals = data.get("totals", {})
          drifted = int(totals.get("drifted", 0) or 0)
          owner = os.getenv("MODEL_OPS_OWNER") or "unassigned"
          run_url = "{}/{}/actions/runs/{}".format(
              os.getenv("GITHUB_SERVER_URL"),
              os.getenv("GITHUB_REPOSITORY"),
              os.getenv("GITHUB_RUN_ID"),
          )

          lines = []
          if status in {"skipped", "failed_config"}:
              lines.append(f"- Drift notification: not sent (`{status}`)")
          elif drifted > 0:
              lines.append(f"- Drift notification owner: `{owner}`")
              lines.append(f"- Drifted models: `{drifted}`")
              payload = {
                  "text": (
                      f"[LastPing][Predictive Ops] Drift detected ({drifted} model(s)). "
                      f"Owner: {owner}. Run: {run_url}"
                  )
              }
              Path("artifacts/predictive_model_ops_alert.json").write_text(
                  json.dumps(payload),
                  encoding="utf-8",
              )
          else:
              lines.append("- Drift notification: not required (`0` drifted)")

          Path("artifacts/predictive_model_ops_alert.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

          cat artifacts/predictive_model_ops_alert.md >> "$GITHUB_STEP_SUMMARY"

          if [ -f artifacts/predictive_model_ops_alert.json ] && [ -n "$MODEL_OPS_ALERT_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$MODEL_OPS_ALERT_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data @artifacts/predictive_model_ops_alert.json \
              || echo "::warning::Failed to post predictive drift notification webhook."
          elif [ -f artifacts/predictive_model_ops_alert.json ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::warning::Drift detected but MODEL_OPS_ALERT_WEBHOOK_URL is not configured."
          fi

      - name: Write run evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          result_path = Path("artifacts/predictive_model_ops.json")
          readiness_path = Path("artifacts/predictive_model_ops_readiness.json")

          result = {}
          readiness = {}
          if result_path.exists():
              result = json.loads(result_path.read_text(encoding="utf-8"))
          if readiness_path.exists():
              readiness = json.loads(readiness_path.read_text(encoding="utf-8"))

          evidence = {
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "event": os.getenv("GITHUB_EVENT_NAME"),
              "workflow": os.getenv("GITHUB_WORKFLOW"),
              "run_id": os.getenv("GITHUB_RUN_ID"),
              "run_number": os.getenv("GITHUB_RUN_NUMBER"),
              "run_attempt": os.getenv("GITHUB_RUN_ATTEMPT"),
              "run_url": "{}/{}/actions/runs/{}".format(
                  os.getenv("GITHUB_SERVER_URL"),
                  os.getenv("GITHUB_REPOSITORY"),
                  os.getenv("GITHUB_RUN_ID"),
              ),
              "owner_configured": bool(os.getenv("MODEL_OPS_OWNER")),
              "webhook_configured": bool(os.getenv("MODEL_OPS_ALERT_WEBHOOK_URL")),
              "database_configured": bool(os.getenv("DATABASE_URL")),
              "readiness": readiness,
              "result": result,
          }

          Path("artifacts/predictive_model_ops_evidence.json").write_text(
              json.dumps(evidence, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictive-model-ops-${{ github.run_id }}
          path: artifacts/
