name: SDK CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build
          python -m pip install -e ./lastping_sdk[async,dev]

      - name: Run SDK tests
        run: |
          python -m pytest tests/test_sdk.py tests/test_sdk_async.py -q

      - name: Build SDK
        run: |
          python -m build lastping_sdk
