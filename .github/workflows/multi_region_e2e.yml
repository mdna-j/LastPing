name: Multi-Region E2E

on:
  workflow_dispatch:
    inputs:
      staging_signoff:
        description: "Record formal staging operational signoff evidence"
        required: false
        default: false
        type: boolean
      staging_environment:
        description: "Staging environment name (e.g. staging-us)"
        required: false
        type: string
      signoff_owner:
        description: "Person/team approving signoff"
        required: false
        type: string
      change_ticket:
        description: "Change ticket / CAB reference"
        required: false
        type: string
      evidence_link:
        description: "Link to dashboard/logs/runbook evidence"
        required: false
        type: string
      signoff_notes:
        description: "Optional notes for this signoff"
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"
    - cron: "41 3 * * *"
  push:
    branches: [ main ]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "src/deps.py"
      - "src/worker.py"
      - "src/models.py"
      - "src/routers/projects.py"
      - "src/routers/checks.py"
      - "docker-compose.yml"
      - "multi_region.md"
      - "docs/multi_region_validation.md"
      - ".github/workflows/multi_region_e2e.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "src/deps.py"
      - "src/worker.py"
      - "src/models.py"
      - "src/routers/projects.py"
      - "src/routers/checks.py"
      - "docker-compose.yml"
      - "multi_region.md"
      - "docs/multi_region_validation.md"
      - ".github/workflows/multi_region_e2e.yml"

concurrency:
  group: multi-region-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name != 'schedule' || github.event.schedule == '17 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create .env For Compose
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://lastping:lastping@db:5432/lastping
          WORKER_SCAN_INTERVAL=2
          WORKER_LEASE_SECONDS=10
          WORKER_FAILOVER_AFTER_SECONDS=5
          EOF

      - name: Start Multi-Region Stack
        run: |
          docker compose --profile multi-region up -d --build --scale worker=0

      - name: Wait For API Health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "API healthy."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time."
          docker compose logs --tail=200 api || true
          exit 1

      - name: Create Project + Region-Pinned Check (us-east)
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          base_url = "http://localhost:8000"

          def post_json(path, payload, headers=None):
            merged_headers = {"Content-Type": "application/json"}
            if headers:
              merged_headers.update(headers)
            req = urllib.request.Request(
              base_url + path,
              data=json.dumps(payload).encode("utf-8"),
              headers=merged_headers,
              method="POST",
            )
            try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                body = resp.read().decode("utf-8")
                return resp.getcode(), json.loads(body)
            except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"{path} failed: HTTP {exc.code}")
              print(body)
              raise

          _, project_resp = post_json("/projects/", {"name": "ci-multi-region"})
          project_id = project_resp["project"]["id"]
          api_key = project_resp["api_key"].strip()
          if not api_key:
            raise RuntimeError("project creation returned an empty api_key")

          _, check_resp = post_json(
            f"/projects/{project_id}/checks/",
            {
              "name": "ci-us-east",
              "type": "heartbeat",
              "expected_interval": 60,
              "grace_period": 0,
              "region": "us-east",
              "alert_enabled": False,
            },
            headers={
              "X-API-KEY": api_key,
            },
          )
          check_id = check_resp["id"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
            fh.write(f"PROJECT_ID={project_id}\n")
            fh.write(f"API_KEY={api_key}\n")
            fh.write(f"CHECK_ID={check_id}\n")
          PY

      - name: Wait For Initial Lease (Expect us-east-1)
        run: |
          for i in {1..60}; do
            owner="$(docker compose exec -T db psql -U lastping -d lastping -t -A -c "select lease_owner from check_lease where check_id=${CHECK_ID};" | tr -d '\r' | xargs)"
            if [ -n "$owner" ]; then
              echo "Initial lease owner: $owner"
              if [ "$owner" != "us-east-1" ]; then
                echo "Expected initial lease owner us-east-1, got: $owner"
                docker compose logs --tail=200 worker_us || true
                docker compose logs --tail=200 worker_eu || true
                docker compose logs --tail=200 worker_ap || true
                exit 1
              fi
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for initial lease acquisition."
          docker compose logs --tail=200 worker_us || true
          exit 1

      - name: Stop Primary Worker And Wait For Failover
        run: |
          docker compose stop worker_us
          for i in {1..90}; do
            owner="$(docker compose exec -T db psql -U lastping -d lastping -t -A -c "select lease_owner from check_lease where check_id=${CHECK_ID};" | tr -d '\r' | xargs)"
            if [ -n "$owner" ] && [ "$owner" != "us-east-1" ]; then
              echo "Failover observed. New lease owner: $owner"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for failover lease owner change."
          docker compose logs --tail=200 worker_eu || true
          docker compose logs --tail=200 worker_ap || true
          exit 1

      - name: Teardown
        if: always()
        run: |
          docker compose down -v

  soak_nightly:
    if: github.event_name == 'schedule' && github.event.schedule == '41 3 * * *'
    name: soak (${{ matrix.iteration }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        iteration: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env For Compose
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://lastping:lastping@db:5432/lastping
          WORKER_SCAN_INTERVAL=2
          WORKER_LEASE_SECONDS=10
          WORKER_FAILOVER_AFTER_SECONDS=5
          EOF

      - name: Start Multi-Region Stack
        run: |
          docker compose --profile multi-region up -d --build --scale worker=0

      - name: Wait For API Health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "API healthy."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time."
          docker compose logs --tail=200 api || true
          exit 1

      - name: Create Project + Region-Pinned Check (us-east)
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base_url = "http://localhost:8000"
          run_id = os.environ.get("GITHUB_RUN_ID", "local")
          iteration = os.environ.get("MATRIX_ITERATION", "0")

          def post_json(path, payload, headers=None):
            merged_headers = {"Content-Type": "application/json"}
            if headers:
              merged_headers.update(headers)
            req = urllib.request.Request(
              base_url + path,
              data=json.dumps(payload).encode("utf-8"),
              headers=merged_headers,
              method="POST",
            )
            try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                body = resp.read().decode("utf-8")
                return resp.getcode(), json.loads(body)
            except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"{path} failed: HTTP {exc.code}")
              print(body)
              raise

          _, project_resp = post_json("/projects/", {"name": f"ci-multi-region-soak-{iteration}-{run_id}"})
          project_id = project_resp["project"]["id"]
          api_key = project_resp["api_key"].strip()
          if not api_key:
            raise RuntimeError("project creation returned an empty api_key")

          _, check_resp = post_json(
            f"/projects/{project_id}/checks/",
            {
              "name": f"ci-us-east-soak-{iteration}",
              "type": "heartbeat",
              "expected_interval": 60,
              "grace_period": 0,
              "region": "us-east",
              "alert_enabled": False,
            },
            headers={
              "X-API-KEY": api_key,
            },
          )
          check_id = check_resp["id"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
            fh.write(f"PROJECT_ID={project_id}\n")
            fh.write(f"API_KEY={api_key}\n")
            fh.write(f"CHECK_ID={check_id}\n")
          PY
        env:
          MATRIX_ITERATION: ${{ matrix.iteration }}

      - name: Wait For Initial Lease (Expect us-east-1)
        run: |
          for i in {1..60}; do
            owner="$(docker compose exec -T db psql -U lastping -d lastping -t -A -c "select lease_owner from check_lease where check_id=${CHECK_ID};" | tr -d '\r' | xargs)"
            if [ -n "$owner" ]; then
              echo "Initial lease owner: $owner"
              if [ "$owner" != "us-east-1" ]; then
                echo "Expected initial lease owner us-east-1, got: $owner"
                docker compose logs --tail=200 worker_us || true
                docker compose logs --tail=200 worker_eu || true
                docker compose logs --tail=200 worker_ap || true
                exit 1
              fi
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for initial lease acquisition."
          docker compose logs --tail=200 worker_us || true
          exit 1

      - name: Stop Primary Worker And Wait For Failover
        run: |
          docker compose stop worker_us
          for i in {1..90}; do
            owner="$(docker compose exec -T db psql -U lastping -d lastping -t -A -c "select lease_owner from check_lease where check_id=${CHECK_ID};" | tr -d '\r' | xargs)"
            if [ -n "$owner" ] && [ "$owner" != "us-east-1" ]; then
              echo "Failover observed. New lease owner: $owner"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for failover lease owner change."
          docker compose logs --tail=200 worker_eu || true
          docker compose logs --tail=200 worker_ap || true
          exit 1

      - name: Teardown
        if: always()
        run: |
          docker compose down -v

  staging_signoff:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.staging_signoff == 'true'
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Required Signoff Inputs
        env:
          STAGING_ENVIRONMENT: ${{ github.event.inputs.staging_environment }}
          SIGNOFF_OWNER: ${{ github.event.inputs.signoff_owner }}
          CHANGE_TICKET: ${{ github.event.inputs.change_ticket }}
          EVIDENCE_LINK: ${{ github.event.inputs.evidence_link }}
        run: |
          missing=0
          if [ -z "$STAGING_ENVIRONMENT" ]; then
            echo "Missing required input: staging_environment"
            missing=1
          fi
          if [ -z "$SIGNOFF_OWNER" ]; then
            echo "Missing required input: signoff_owner"
            missing=1
          fi
          if [ -z "$CHANGE_TICKET" ]; then
            echo "Missing required input: change_ticket"
            missing=1
          fi
          if [ -z "$EVIDENCE_LINK" ]; then
            echo "Missing required input: evidence_link"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build Staging Signoff Evidence
        env:
          STAGING_ENVIRONMENT: ${{ github.event.inputs.staging_environment }}
          SIGNOFF_OWNER: ${{ github.event.inputs.signoff_owner }}
          CHANGE_TICKET: ${{ github.event.inputs.change_ticket }}
          EVIDENCE_LINK: ${{ github.event.inputs.evidence_link }}
          SIGNOFF_NOTES: ${{ github.event.inputs.signoff_notes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          record = {
              "status": "approved",
              "recorded_at_utc": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "workflow": "Multi-Region E2E",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "run_url": os.environ.get("RUN_URL"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF"),
              "sha": os.environ.get("GITHUB_SHA"),
              "actor": os.environ.get("GITHUB_ACTOR"),
              "staging_environment": os.environ.get("STAGING_ENVIRONMENT"),
              "signoff_owner": os.environ.get("SIGNOFF_OWNER"),
              "change_ticket": os.environ.get("CHANGE_TICKET"),
              "evidence_link": os.environ.get("EVIDENCE_LINK"),
              "notes": os.environ.get("SIGNOFF_NOTES", ""),
          }
          Path("artifacts/staging_signoff.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          Path("artifacts/staging_signoff.md").write_text(
              "\n".join(
                  [
                      "## Staging Operational Signoff",
                      "",
                      f"- Status: `APPROVED`",
                      f"- Environment: `{record['staging_environment']}`",
                      f"- Signoff owner: `{record['signoff_owner']}`",
                      f"- Change ticket: `{record['change_ticket']}`",
                      f"- Evidence: {record['evidence_link']}",
                      f"- Commit: `{record['sha']}`",
                      f"- Run: {record['run_url']}",
                      f"- Recorded (UTC): `{record['recorded_at_utc']}`",
                  ]
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Staging Signoff Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-signoff-${{ github.run_id }}
          path: artifacts/staging_signoff.*
          retention-days: 30

      - name: Publish Staging Signoff Summary
        run: |
          cat artifacts/staging_signoff.md >> "$GITHUB_STEP_SUMMARY"
