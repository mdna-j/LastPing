name: Java SDK CI

on:
  push:
    paths:
      - "lastping_sdk/java/**"
      - ".github/workflows/java_sdk_ci.yml"
    tags:
      - "java-sdk-v*"
  pull_request:
    paths:
      - "lastping_sdk/java/**"
      - ".github/workflows/java_sdk_ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build with Gradle
        working-directory: lastping_sdk/java
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Build with Maven
        working-directory: lastping_sdk/java
        run: mvn -q -f pom.xml package

  publish:
    if: startsWith(github.ref, 'refs/tags/java-sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Publish to GitHub Packages (Gradle)
        working-directory: lastping_sdk/java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew publish
          else
            gradle publish
          fi

      - name: Publish to GitHub Packages (Maven)
        working-directory: lastping_sdk/java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -q -f pom.xml deploy -DskipTests \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}
