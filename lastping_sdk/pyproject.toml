[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lastping-sdk"
version = "0.1.0"
description = "Minimal Python SDK for LastPing (heartbeat + webhook helpers)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "mdna-j", email = "mdnajjose@gmail.com" }]
dependencies = [
  "requests>=2.0"
]

[project.optional-dependencies]
async = ["aiohttp>=3.8"]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools]
packages = ["lastping_sdk"]

[tool.setuptools.package-dir]
lastping_sdk = "."
