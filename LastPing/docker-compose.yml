version: '3.8'

services:
  api:
    build: .
    container_name: lastping_api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: lastping_worker
    # Placeholder worker; replace with your worker module/command
    command: python -u src/worker.py
    env_file:
      - .env
    depends_on:
      - redis
      - db

  db:
    image: postgres:15
    container_name: lastping_db
    environment:
      POSTGRES_USER: lastping
      POSTGRES_PASSWORD: lastping
      POSTGRES_DB: lastping
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lastping_redis
    ports:
      - "6379:6379"

volumes:
  db-data:
